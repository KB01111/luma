[package]
name = "luma"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A fast, beautiful Windows spotlight launcher built with Rust and GPUI Kit"
license = "MIT"

[dependencies]
gpui-kit = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
dirs = "6"
ignore = "0.4"
nucleo-matcher = "0.3"
async-channel = "2.3"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
winreg = "0.55"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
